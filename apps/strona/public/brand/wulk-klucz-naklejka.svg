<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Naklejka klucza krzyżakowego — odpowiednik lancy z hero detailingu:
       sylwetka z wypaloną obwódką (czarna → biała → grafika), lekki obrót. -->
  <defs>
    <g id="krzyz">
      <rect x="91" y="18" width="18" height="164" rx="9"/>
      <rect x="18" y="91" width="164" height="18" rx="9"/>
      <rect x="82" y="8" width="36" height="36" rx="9"/>
      <rect x="82" y="156" width="36" height="36" rx="9"/>
      <rect x="8" y="82" width="36" height="36" rx="9"/>
      <rect x="156" y="82" width="36" height="36" rx="9"/>
      <circle cx="100" cy="100" r="17"/>
    </g>
  </defs>
  <g transform="rotate(24 100 100)">
    <!-- obwódka: czarna kreska na zewnątrz białego pasa -->
    <use href="#krzyz" fill="#0e0f11" stroke="#0e0f11" stroke-width="26" stroke-linejoin="round"/>
    <use href="#krzyz" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
    <!-- grafika właściwa -->
    <rect x="91" y="18" width="18" height="164" rx="9" fill="#d9dbe0" stroke="#0e0f11" stroke-width="5"/>
    <rect x="18" y="91" width="164" height="18" rx="9" fill="#d9dbe0" stroke="#0e0f11" stroke-width="5"/>
    <line x1="97" y1="34" x2="97" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="97" x2="80" y2="97" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <g fill="#f0392e" stroke="#0e0f11" stroke-width="5">
      <rect x="82" y="8" width="36" height="36" rx="9"/>
      <rect x="82" y="156" width="36" height="36" rx="9"/>
      <rect x="8" y="82" width="36" height="36" rx="9"/>
      <rect x="156" y="82" width="36" height="36" rx="9"/>
    </g>
    <g fill="#0e0f11">
      <path d="M100 17 l7.8 4.5 v9 l-7.8 4.5 l-7.8 -4.5 v-9 z"/>
      <path d="M100 165 l7.8 4.5 v9 l-7.8 4.5 l-7.8 -4.5 v-9 z"/>
      <path d="M26 91 l7.8 4.5 v9 l-7.8 4.5 l-7.8 -4.5 v-9 z"/>
      <path d="M174 91 l7.8 4.5 v9 l-7.8 4.5 l-7.8 -4.5 v-9 z"/>
    </g>
    <circle cx="100" cy="100" r="17" fill="#ffffff" stroke="#0e0f11" stroke-width="5"/>
    <circle cx="100" cy="100" r="5" fill="#0e0f11"/>
  </g>
</svg>
